name: Feature request
description: Propose a new workflow or template capability
title: "Feature: "
labels:
  - enhancement
body:
  - type: input
    id: use_case
    attributes:
      label: Use case
      description: Which project or workflow is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior.
    validations:
      required: true
